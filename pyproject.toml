[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openpipe"
version = "0.0.1"
description = "Pipeline tools for VFX"
readme = "README.md"
authors = [
    { name = "Jihyun Nam", email = "initialfx@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
openpipe_hello = "openpipe.cli.hello:main"
openpipe_foo = "openpipe.cli.foo:main"
openpipe_tree = "openpipe.cli.treeview:main"
run_houdini = "openpipe.cli.run_houdini:main"
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
